name: Build
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Forge MDK
        run: |
          curl -L -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.8.9-11.15.1.2318-1.8.9/forge-1.8.9-11.15.1.2318-1.8.9-mdk.zip
          mkdir mdk && unzip -q mdk.zip -d mdk
          unzip -q KlexClient-source.zip
          rm -rf mdk/src
          cp -r KlexClient/src mdk/src
      - name: Build
        working-directory: mdk
        run: |
          chmod +x gradlew
          ./gradlew setupCIWorkspace build
      - uses: actions/upload-artifact@v4
        with:
          name: KlexClient
          path: mdk/build/libs/*.jar
